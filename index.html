<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mindful Days – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#0E3B2E;--sub:#4d6b61;--peach:#F6C9A6;--blue:#2A93CC;--sky:#BFE4F7;--forest:#0E3B2E;--green:#1F7A58;--coral:#C8553D;--line:#ecd8c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media(min-width:600px){body{background:#fff;padding:16px}#app{min-height:0;height:min(880px,calc(100vh - 32px));border-radius:36px;overflow:hidden;box-shadow:0 10px 40px rgba(14,59,46,.25);border:8px solid var(--sky)}}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
h1{font-size:28px;margin:6px 0 4px;line-height:1.25}h2{font-size:22px;margin:14px 0 8px}p{margin:6px 0;line-height:1.5}
.sub{color:var(--sub);font-size:16px}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;color:var(--forest);border-bottom:2px solid var(--line)}
.top b{font-size:20px;flex:1}
.back{background:var(--sky);color:var(--forest);border-radius:14px;padding:10px 16px;font-weight:700;font-size:18px;min-height:48px}
.big{width:100%;min-height:64px;border-radius:20px;font-weight:700;font-size:22px;padding:14px;margin:8px 0;background:var(--blue);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big.g{background:var(--green)}.big.f{background:var(--forest)}.big.p{background:var(--peach);color:var(--forest)}.big.o{background:transparent;border:3px solid var(--forest);color:var(--ink);box-shadow:none}
.big.sm{min-height:52px;font-size:18px}
.card{background:var(--card);border-radius:22px;padding:14px;margin:10px 0;border:2px solid var(--line)}
.clock{background:var(--forest);color:#FBEBDD;border-radius:22px;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.clock b{font-size:44px;line-height:1}.clock span{background:var(--sky);color:var(--forest);padding:3px 12px;border-radius:20px;font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{border-radius:24px;min-height:150px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:20px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:center}
.tile .ic{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:34px}
.t1{background:var(--forest)}.t2{background:var(--blue)}.t3{background:var(--peach);color:var(--forest)}.t3 .ic{background:rgba(255,255,255,.55)}.t4{background:var(--green)}
.bub{display:flex;align-items:flex-end;gap:8px;margin:10px 0}
.bub .t{background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 14px;font-weight:600;flex:1;box-shadow:0 2px 0 var(--line);border:none;text-align:left;color:var(--ink)}
.row{display:flex;align-items:center;gap:12px}
.chip{border-radius:20px;padding:4px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.c-done{background:#cfeedd;color:#0e5a3c}.c-pend{background:var(--sky);color:#0b4b72}.c-skip{background:var(--peach);color:#7a3c12}
.ic2{width:52px;height:52px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:28px;flex:none}
.bar{height:14px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(var(--n,2),1fr);margin:12px 0}
.cd{aspect-ratio:1;border-radius:20px;font-size:52px;background:var(--card);border:4px solid var(--blue);display:grid;place-items:center;min-height:84px}
.cd.back2{background:var(--blue);color:#fff;font-size:40px}.cd.ok{background:#cfeedd;border-color:var(--green)}
.opt{font-size:44px;border-radius:20px;background:var(--card);border:4px solid var(--sky);min-height:84px}
.opt.sel{border-color:var(--green);background:#cfeedd}
.cat{min-height:80px;border-radius:20px;font-size:22px;font-weight:700;color:#fff}
.tabs{display:flex;background:var(--card);border-top:2px solid var(--line)}
.tabs button{flex:1;background:none;padding:8px 2px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;color:var(--sub)}
.tabs button span{font-size:24px}.tabs .on{color:var(--ink);background:var(--sky)}
.photo{border-radius:24px;aspect-ratio:4/3;display:grid;place-items:center;font-size:92px;margin:8px 0}
input,select{font:inherit;width:100%;padding:12px;border-radius:14px;border:3px solid var(--sky);background:var(--card);color:var(--ink);margin:4px 0}
.stat{flex:1;background:var(--card);border-radius:18px;padding:10px;text-align:center}.stat b{font-size:34px;display:block;color:var(--blue)}.stat small{font-size:14px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.note{font-size:14px;color:var(--sub);text-align:center;margin:12px 0 0}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tg{width:56px;height:32px;border-radius:20px;background:var(--line);position:relative}.tg.on{background:var(--green)}.tg i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on i{left:28px}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.bob{animation:none}}
.rec{color:var(--coral);font-weight:700}
.scene{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20400%20800%27%20preserveAspectRatio%3D%27xMidYMax%20slice%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27s%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%238fd3f4%27/%3E%3Cstop%20offset%3D%27.62%27%20stop-color%3D%27%23d9f1fb%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23fdf6e3%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27400%27%20height%3D%27800%27%20fill%3D%27url%28%23s%29%27/%3E%3Ccircle%20cx%3D%27335%27%20cy%3D%2785%27%20r%3D%2734%27%20fill%3D%27%23fff3b0%27/%3E%3Cg%20fill%3D%27%23fff%27%3E%3Cellipse%20cx%3D%2780%27%20cy%3D%27130%27%20rx%3D%2746%27%20ry%3D%2716%27/%3E%3Cellipse%20cx%3D%27108%27%20cy%3D%27116%27%20rx%3D%2730%27%20ry%3D%2716%27/%3E%3Cellipse%20cx%3D%2758%27%20cy%3D%27118%27%20rx%3D%2726%27%20ry%3D%2713%27/%3E%3Cellipse%20cx%3D%27270%27%20cy%3D%27240%27%20rx%3D%2740%27%20ry%3D%2713%27/%3E%3Cellipse%20cx%3D%27292%27%20cy%3D%27228%27%20rx%3D%2726%27%20ry%3D%2714%27/%3E%3C/g%3E%3Cpath%20d%3D%27M0%20640Q120%20580%20240%20630T400%20610V800H0Z%27%20fill%3D%27%23bfe8b0%27/%3E%3Cpath%20d%3D%27M0%20700Q140%20650%20260%20695T400%20680V800H0Z%27%20fill%3D%27%239fd89a%27/%3E%3Cpath%20d%3D%27M0%20760Q150%20725%20400%20755V800H0Z%27%20fill%3D%27%237cc58a%27/%3E%3Crect%20x%3D%2752%27%20y%3D%27592%27%20width%3D%2712%27%20height%3D%2762%27%20rx%3D%274%27%20fill%3D%27%23a9744f%27/%3E%3Ccircle%20cx%3D%2758%27%20cy%3D%27574%27%20r%3D%2734%27%20fill%3D%27%235fb36f%27/%3E%3Ccircle%20cx%3D%2738%27%20cy%3D%27596%27%20r%3D%2722%27%20fill%3D%27%236cc27c%27/%3E%3Ccircle%20cx%3D%2780%27%20cy%3D%27596%27%20r%3D%2722%27%20fill%3D%27%236cc27c%27/%3E%3Crect%20x%3D%27334%27%20y%3D%27612%27%20width%3D%2710%27%20height%3D%2752%27%20rx%3D%274%27%20fill%3D%27%23a9744f%27/%3E%3Ccircle%20cx%3D%27339%27%20cy%3D%27596%27%20r%3D%2728%27%20fill%3D%27%235fb36f%27/%3E%3Ccircle%20cx%3D%27320%27%20cy%3D%27614%27%20r%3D%2718%27%20fill%3D%27%236cc27c%27/%3E%3Ccircle%20cx%3D%27358%27%20cy%3D%27614%27%20r%3D%2718%27%20fill%3D%27%236cc27c%27/%3E%3Crect%20x%3D%27196%27%20y%3D%27672%27%20width%3D%278%27%20height%3D%2736%27%20rx%3D%273%27%20fill%3D%27%23a9744f%27/%3E%3Ccircle%20cx%3D%27200%27%20cy%3D%27662%27%20r%3D%2720%27%20fill%3D%27%236cc27c%27/%3E%3Cg%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%27735%27%20r%3D%275%27%20fill%3D%27%23f08a7a%27/%3E%3Ccircle%20cx%3D%27150%27%20cy%3D%27748%27%20r%3D%275%27%20fill%3D%27%23ffd36b%27/%3E%3Ccircle%20cx%3D%27260%27%20cy%3D%27738%27%20r%3D%275%27%20fill%3D%27%23f08a7a%27/%3E%3Ccircle%20cx%3D%27300%27%20cy%3D%27752%27%20r%3D%275%27%20fill%3D%27%23ffd36b%27/%3E%3Ccircle%20cx%3D%2730%27%20cy%3D%27760%27%20r%3D%275%27%20fill%3D%27%23ffd36b%27/%3E%3C/g%3E%3C/svg%3E") center bottom/cover no-repeat}
.scene>p,.scene>h1,.scene>.note{background:rgba(255,255,255,.82);border-radius:16px;padding:6px 12px}
.scene .big.o{background:rgba(255,255,255,.92)}
#split iframe{width:390px;max-width:100%;height:760px;border:6px solid var(--sky);border-radius:30px;background:#fff;display:block;margin:4px auto}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.15em;font-style:normal}.ico svg{width:100%;height:100%;display:block}.photo{color:var(--forest)}.photo .ico{opacity:.55}
</style>

const ICO_RE=new RegExp('('+Object.keys(ICO).sort((a,b)=>b.length-a.length).join('|')+')\uFE0F?','g');
function iconify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/SCRIPT|STYLE|TEXTAREA|OPTION/.test(n.parentElement.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}),hit=[];let n;
 while(n=w.nextNode()){ICO_RE.lastIndex=0;if(ICO_RE.test(n.nodeValue))hit.push(n)}
 hit.forEach(n=>{const sp=document.createElement('span');sp.innerHTML=n.nodeValue.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(ICO_RE,(m,k)=>`<i class="ico" aria-hidden="true">${ICO[k]}</i>`);n.replaceWith(...sp.childNodes)})}
let _q=0;new MutationObserver(()=>{if(!_q){_q=1;requestAnimationFrame(()=>{_q=0;iconify(document.body)})}}).observe(document.body,{childList:true,subtree:true});

function top2(){return `<div class="top"><b>มุมมองผู้ดูแล</b>${AUTO==='cg'?`<span class="chip c-done" style="font-size:13px;max-width:62%">● ${LIVE||'รอผู้สูงอายุ'}</span>`:''}</div>`}
function liveText(){if(AUTO!=='elder')return '';const m={home:'อยู่หน้าหลัก',day:'ดูกิจวัตรวันนี้',det:'เปิดดูกิจกรรม',steps:'กำลังทำกิจกรรมทีละขั้น',done:'ทำกิจกรรมสำเร็จ 🎉',games:'เลือกเกมฝึกสมอง',pm:'กำลังเล่นจับคู่ภาพ',od:'กำลังเล่นจำลำดับภาพ',so:'กำลังเล่นจัดหมวดของใช้',sl:'กำลังเล่นเลือกของตามรายการ',res:'เล่นเกมจบแล้ว 🎉',mem:'กำลังดูภาพความทรงจำ',garden:'ดูสวนของฉัน',conn:'เชื่อมต่อแล้ว'};let t=m[S.scr]||'';if(S.scr==='steps'||S.scr==='det'){const r=R.find(r=>r.id===S.cur);if(r)t=(S.scr==='steps'?'กำลังทำ: ':'เปิดดู: ')+r.n}return t}
function sync(){if(!CH||!AUTO)return;const d=JSON.stringify({R,L,M,lv,G}),l=liveText();if(d!==lastStr){lastStr=d;parent.postMessage({md:1,from:AUTO,data:JSON.parse(d)},'*')}if(l!==lastLive){lastLive=l;parent.postMessage({md:1,from:AUTO,live:l},'*')}}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:12px;right:12px;top:12px;background:#0E3B2E;color:#fff;padding:12px 14px;border-radius:16px;font-weight:700;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
window.addEventListener('message',e=>{const m=e.data;if(!m||!m.md)return;
 if(CH&&AUTO){let ch=0;if(m.data){const n=L.length;R=m.data.R;L=m.data.L;M=m.data.M;lv=m.data.lv;if(m.data.G)G=m.data.G;lastStr=JSON.stringify(m.data);ch=1;if(AUTO==='cg'&&L.length>n&&L[0])toast('🔔 คุณลุงสมชาย: '+L[0].n+' – '+L[0].r)}
  if(m.live!==undefined){LIVE=m.live;ch=1}
  if(ch&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))render();return}
 if(!CH&&$('split')){const t=$(m.from==='elder'?'fc':'fe');t&&t.contentWindow.postMessage(m,'*');const who=m.from==='elder'?'🧓 ':'🧑‍🤝‍🧑 ';
  if(m.live)feedAdd(who+m.live);
  if(m.data){const n=m.data.L.length;if(n>lastN&&m.data.L[0])feedAdd('✅ '+m.data.L[0].n+' – '+m.data.L[0].r);lastN=n;const rn=m.data.R.length;if(m.from==='cg'&&rn!==lastRN)feedAdd('🧑‍🤝‍🧑 ผู้ดูแลปรับกิจวัตร (ตอนนี้ '+rn+' รายการ)');lastRN=rn}}});
function feedAdd(t){FEED.unshift(new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'  '+t);FEED=FEED.slice(0,7);const f=$('feed');if(f)f.innerHTML='<b>บันทึกเรียลไทม์</b>'+FEED.map(x=>`<div class="sub">${esc(x)}</div>`).join('')}
function buildSplit(){if($('split'))return;$('app').style.display='none';const w=document.createElement('div');w.id='split';w.style.cssText='width:100%;max-width:960px;padding:8px 4px';
 w.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><b style="font-size:20px">โหมดสาธิตแยกจอ · อัปเดตทันที</b><button class="back" onclick="exitSplit()">← กลับ</button></div><div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap"><div style="flex:none"><div class="sub" style="text-align:center;font-weight:700">🧓 เครื่องของผู้สูงอายุ</div><iframe id="fe" title="ผู้สูงอายุ"></iframe></div><div style="flex:none"><div class="sub" style="text-align:center;font-weight:700">🧑‍🤝‍🧑 เครื่องของผู้ดูแล</div><iframe id="fc" title="ผู้ดูแล"></iframe></div></div><div class="card" id="feed" style="max-width:800px;margin:12px auto"><b>บันทึกเรียลไทม์</b><div class="sub">ลองกดเล่นฝั่งผู้สูงอายุ แล้วดูฝั่งผู้ดูแล</div></div>`;
 document.body.appendChild(w);FEED=[];lastN=L.length;lastRN=R.length;const mk=a=>SRC.replace('<scr'+'ipt>','<scr'+'ipt>window.AUTO="'+a+'";');$('fe').srcdoc=mk('elder');$('fc').srcdoc=mk('cg')}
function exitSplit(){const w=$('split');if(w)w.remove();$('app').style.display='';render()}
if(AUTO==='elder'){S.role='elder';S.scr='home'}else if(AUTO==='cg'){S.role='cg';S.scr='cg';S.link='ok';S.tab='journey'}
render();setInterval(()=>{const c=$('clk');if(c)c.textContent=now()},20000);
</script>
</body>
</html>
